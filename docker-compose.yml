version: "3.9"

services:
  ares:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      # Persist generated assets and databases across container restarts
      - ./static/charts:/app/static/charts
      - ./static/reports:/app/static/reports
      - ./static/shared:/app/static/shared
      - ./uploads:/app/uploads
      - ./ares_history.db:/app/ares_history.db
      - ./ares_checkpoints.db:/app/ares_checkpoints.db
      - ./ares_analytics.db:/app/ares_analytics.db
      - ./ares_vectorstore:/app/ares_vectorstore
      - ./ares_entity_memory.json:/app/ares_entity_memory.json
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
