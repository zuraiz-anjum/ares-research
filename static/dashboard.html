<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ares — Analytics Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #08090b; --surface: #0e1015; --surface2: #13161d; --surface3: #181c25;
      --border: #1c2030; --border2: #232839;
      --accent: #4a7cff; --accent2: #7c4fff;
      --text: #dde1ea; --text-dim: #858fa5; --text-muted: #404860;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; }

    header {
      height: 54px; padding: 0 28px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .logo-row { display: flex; align-items: center; gap: 10px; }
    .logo { width: 28px; height: 28px; background: linear-gradient(135deg,#4a7cff,#7c4fff); border-radius: 8px; display:flex; align-items:center; justify-content:center; font-size:14px; }
    .header-title { font-size: 14px; font-weight: 600; }
    .header-badge { font-size: 10px; color: var(--text-muted); background: var(--surface2); border: 1px solid var(--border2); padding: 2px 8px; border-radius: 20px; text-transform: uppercase; }
    .back-link { font-size: 12px; color: var(--accent); text-decoration: none; }
    .back-link:hover { text-decoration: underline; }

    main { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }

    .page-title { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
    .page-sub   { font-size: 13px; color: var(--text-dim); margin-bottom: 32px; }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 32px; }

    .stat-card {
      background: var(--surface2); border: 1px solid var(--border2); border-radius: 12px;
      padding: 18px 20px;
    }
    .stat-label { font-size: 10.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 500; }
    .stat-value { font-size: 28px; font-weight: 700; color: var(--text); margin-top: 6px; font-variant-numeric: tabular-nums; }
    .stat-unit  { font-size: 13px; color: var(--text-dim); margin-left: 4px; font-weight: 400; }

    .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 32px; }

    .chart-card {
      background: var(--surface2); border: 1px solid var(--border2); border-radius: 12px;
      padding: 20px; position: relative;
    }
    .chart-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-dim); margin-bottom: 16px; }
    .chart-canvas { max-height: 220px; }

    .full-width { grid-column: 1 / -1; }

    .loading { text-align: center; color: var(--text-muted); padding: 80px 0; font-size: 13px; }
    .error-msg { color: #c97070; background: #110b0b; border: 1px solid #2e1010; border-radius: 8px; padding: 12px 16px; margin-bottom: 24px; font-size: 13px; }

    @media (max-width: 700px) { .charts-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<header>
  <div class="logo-row">
    <div class="logo">⚡</div>
    <span class="header-title">Ares</span>
    <span class="header-badge">Analytics</span>
  </div>
  <a href="/" class="back-link">← Back to Ares</a>
</header>

<main>
  <div class="page-title">Usage Analytics</div>
  <div class="page-sub">Live stats from your Ares instance — refreshes automatically every 60 seconds.</div>

  <div id="error-banner" class="error-msg" style="display:none"></div>
  <div id="loading" class="loading">Loading analytics…</div>

  <div id="dashboard" style="display:none">
    <div class="stats-grid" id="stats-grid"></div>
    <div class="charts-grid" id="charts-grid"></div>
  </div>
</main>

<script>
  const ACCENT      = "#4a7cff";
  const ACCENT2     = "#7c4fff";
  const GREEN       = "#2ea06a";
  const AMBER       = "#c9b86a";
  const SURFACE2    = "#13161d";
  const TEXT_DIM    = "#858fa5";
  const BORDER2     = "#232839";

  const MODE_COLORS = {
    research: ACCENT, chat: ACCENT2, comparison: "#ff7c4a",
    report: "#4affa0", pdf: "#c9b86a", data_analysis: "#4affff",
    debate: "#ff4a7c", email: "#b86ac9", plan: "#7cff4a",
    document: "#ff4ac9", code: "#4affc9", chart: "#ffb86a",
  };

  const PROVIDER_COLORS = ["#4a7cff","#7c4fff","#2ea06a","#c9b86a","#ff7c4a"];

  let _charts = {};

  function destroyCharts() {
    Object.values(_charts).forEach(c => c.destroy());
    _charts = {};
  }

  function chartDefaults() {
    return {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { labels: { color: TEXT_DIM, font: { family: "Inter", size: 11 }, padding: 12 } },
        tooltip: {
          backgroundColor: "#0e1015",
          borderColor: BORDER2, borderWidth: 1,
          titleColor: "#dde1ea", bodyColor: TEXT_DIM,
        },
      },
      scales: {
        x: { ticks: { color: TEXT_DIM, font: { size: 11 } }, grid: { color: BORDER2 } },
        y: { ticks: { color: TEXT_DIM, font: { size: 11 } }, grid: { color: BORDER2 } },
      },
    };
  }

  function render(data) {
    // ── Stats cards ────────────────────────────────────────────────
    const statsGrid = document.getElementById("stats-grid");
    statsGrid.innerHTML = "";
    const stats = [
      { label: "Total Requests", value: data.total_requests.toLocaleString(), unit: "" },
      { label: "Avg Tokens / Query", value: Math.round(data.averages.token_count).toLocaleString(), unit: "tok" },
      { label: "Avg Latency", value: (data.averages.latency_ms / 1000).toFixed(1), unit: "s" },
      { label: "Avg Confidence", value: data.averages.confidence_score.toFixed(1), unit: "/ 10" },
      { label: "Pipeline Modes", value: data.by_mode.length, unit: "active" },
      { label: "Providers", value: data.by_provider.length, unit: "active" },
    ];
    stats.forEach(s => {
      statsGrid.insertAdjacentHTML("beforeend", `
        <div class="stat-card">
          <div class="stat-label">${s.label}</div>
          <div class="stat-value">${s.value}<span class="stat-unit">${s.unit}</span></div>
        </div>
      `);
    });

    // ── Charts ─────────────────────────────────────────────────────
    const chartsGrid = document.getElementById("charts-grid");
    chartsGrid.innerHTML = `
      <div class="chart-card">
        <div class="chart-title">Queries per Day (last 7 days)</div>
        <canvas id="chart-daily" class="chart-canvas"></canvas>
      </div>
      <div class="chart-card">
        <div class="chart-title">Requests by Pipeline Mode</div>
        <canvas id="chart-modes" class="chart-canvas"></canvas>
      </div>
      <div class="chart-card">
        <div class="chart-title">Provider Distribution</div>
        <canvas id="chart-providers" class="chart-canvas"></canvas>
      </div>
      <div class="chart-card">
        <div class="chart-title">Top Modes by Volume</div>
        <canvas id="chart-modes-bar" class="chart-canvas"></canvas>
      </div>
    `;

    destroyCharts();

    // Daily line chart
    const daily = data.daily_last_7;
    _charts.daily = new Chart(document.getElementById("chart-daily"), {
      type: "line",
      data: {
        labels: daily.map(d => d.day.slice(5)),
        datasets: [{
          label: "Queries",
          data: daily.map(d => d.count),
          borderColor: ACCENT, backgroundColor: "rgba(74,124,255,0.08)",
          borderWidth: 2, pointRadius: 4, pointBackgroundColor: ACCENT, fill: true, tension: 0.3,
        }],
      },
      options: { ...chartDefaults(), plugins: { ...chartDefaults().plugins, legend: { display: false } } },
    });

    // Mode doughnut
    const modes = data.by_mode.slice(0, 8);
    _charts.modes = new Chart(document.getElementById("chart-modes"), {
      type: "doughnut",
      data: {
        labels: modes.map(m => m.mode),
        datasets: [{
          data: modes.map(m => m.count),
          backgroundColor: modes.map(m => MODE_COLORS[m.mode] || "#6a7cff"),
          borderColor: SURFACE2, borderWidth: 2,
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { position: "right", labels: { color: TEXT_DIM, font: { family: "Inter", size: 11 }, padding: 8, boxWidth: 12 } },
          tooltip: chartDefaults().plugins.tooltip,
        },
      },
    });

    // Provider pie
    const providers = data.by_provider;
    _charts.providers = new Chart(document.getElementById("chart-providers"), {
      type: "pie",
      data: {
        labels: providers.map(p => p.provider),
        datasets: [{
          data: providers.map(p => p.count),
          backgroundColor: PROVIDER_COLORS,
          borderColor: SURFACE2, borderWidth: 2,
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { position: "right", labels: { color: TEXT_DIM, font: { family: "Inter", size: 11 }, padding: 8, boxWidth: 12 } },
          tooltip: chartDefaults().plugins.tooltip,
        },
      },
    });

    // Mode bar chart
    _charts.modesBar = new Chart(document.getElementById("chart-modes-bar"), {
      type: "bar",
      data: {
        labels: modes.map(m => m.mode),
        datasets: [{
          label: "Requests",
          data: modes.map(m => m.count),
          backgroundColor: modes.map(m => (MODE_COLORS[m.mode] || "#6a7cff") + "99"),
          borderColor: modes.map(m => MODE_COLORS[m.mode] || "#6a7cff"),
          borderWidth: 1, borderRadius: 4,
        }],
      },
      options: { ...chartDefaults(), plugins: { ...chartDefaults().plugins, legend: { display: false } } },
    });
  }

  async function load() {
    try {
      const res = await fetch("/analytics");
      if (res.status === 401) {
        document.getElementById("error-banner").textContent = "Authentication required — please log in to Ares first.";
        document.getElementById("error-banner").style.display = "block";
        document.getElementById("loading").style.display = "none";
        return;
      }
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      document.getElementById("loading").style.display = "none";
      document.getElementById("dashboard").style.display = "block";
      render(data);
    } catch (e) {
      document.getElementById("error-banner").textContent = `Failed to load analytics: ${e.message}`;
      document.getElementById("error-banner").style.display = "block";
      document.getElementById("loading").style.display = "none";
    }
  }

  load();
  setInterval(load, 60_000);
</script>
</body>
</html>
